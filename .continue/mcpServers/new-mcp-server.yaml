name: Local Config
version: 1.0.0
schema: v1

models:
  - name: Qwen3 14B
    provider: ollama
    model: qwen3:14b
    roles:
      - chat
      - edit
      - apply

  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    roles:
      - embed

mcpServers:
  - name: filesystem
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - .